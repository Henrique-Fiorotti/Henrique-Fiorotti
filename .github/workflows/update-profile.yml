name: Update profile
on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - portrait.txt
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml
concurrency:
  group: profile-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and save profile
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # This checkout belongs only to the runner. Always generate from
            # the latest remote configuration and preserve every remote commit.
            git fetch origin "$PROFILE_BRANCH"
            git checkout -B "$PROFILE_BRANCH" FETCH_HEAD
            python scripts/update_profile.py --fetch
            git add -- dark_mode.svg light_mode.svg
            if [ -f stats.json ]; then
              git add -- stats.json
            fi
            if git diff --cached --quiet; then
              echo 'Profile is already up to date.'
              exit 0
            fi
            git commit -m 'Update profile uptime and public stats'
            if git push origin "HEAD:refs/heads/$PROFILE_BRANCH"; then
              exit 0
            fi
            echo 'Push failed; retrying with the latest remote version.'
          done
          echo 'Could not save the profile after three attempts.' >&2
          exit 1
